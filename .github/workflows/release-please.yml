# Opens and maintains the release PR from Conventional Commits on main; merging that PR
# bumps __version__ in src/dyness_b3_bms_mqtt/__init__.py, updates CHANGELOG.md and tags
# vX.Y.Z. The "python" release type finds that file from the package name on its own and
# skips pyproject.toml, whose version is dynamic. uv.lock records no version for this
# package, so a release leaves nothing in the lock to bump (INST-11, INST-17).
# Its two "generic" entries rewrite every line marked `x-release-please-version` in
# README.md and docs/specs/10-installation.md, so the quick start always downloads the
# latest release's source archive (INST-18).
# "prerelease": true marks each GitHub release as a prerelease until 1.0 (INST-18).
# "include-component-in-tag": false keeps tags as plain vX.Y.Z: release-please otherwise
# prefixes the package name (dyness-b3-bms-mqtt-v0.1.0), and the quick-start archive URL
# and unpacked directory name expect vX.Y.Z (INST-18).
#
# .release-please-manifest.json records the last released version, matching the newest
# vX.Y.Z tag; release-please computes the next version from it and the commits since that
# tag (a feat bumps the minor version before 1.0). Each release PR moves, together:
# __version__ in src/dyness_b3_bms_mqtt/__init__.py, the manifest, and the two
# `x-release-please-version` lines (README quick start, docs/specs/10-installation.md §6).
name: release-please

on:
  push:
    branches: [main]

permissions:
  # Push the release branch and tags, and create the GitHub release.
  contents: write
  # Open and update the release PR.
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
