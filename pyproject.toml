[project]
name = "dyness-b3-bms-mqtt"
version = "0.1.0"
description = "Read a Dyness B3 battery stack over CAN and publish it to MQTT with Home Assistant discovery"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["python-can>=4.5,<5", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
gs-usb = ["gs-usb", "pyusb"]

[project.scripts]
dyness-b3-bms-mqtt = "dyness_b3_bms_mqtt.app:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "mypy>=2.4",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "req(*ids): the test verifies the named requirement identifiers (PREFIX-NN)",
    "integration: uses real wall-clock time; may sleep; 10 s per-test timeout",
    "mosquitto: needs a real MQTT broker; skipped unless MQTT_HOST:MQTT_PORT accepts a TCP connection within 1 s",
    "hardware: needs the real stack on CAN_CHANNEL; skipped unless --hardware is given",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gs_usb.*", "usb.*"]
ignore_missing_imports = true
