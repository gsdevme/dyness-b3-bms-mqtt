# Opens and maintains the release PR from Conventional Commits on main; merging that PR
# bumps the version in pyproject.toml, updates CHANGELOG.md and tags vX.Y.Z.
# The "extra-files" entry in release-please-config.json also bumps this package's own
# version in uv.lock, so the committed lock stays current after a release (INST-11).
# Its two "generic" entries rewrite every line marked `x-release-please-version` in
# README.md and docs/specs/10-installation.md, so the quick start always downloads the
# latest release's source archive (INST-18).
# "prerelease": true marks each GitHub release as a prerelease until 1.0 (INST-18).
# "include-component-in-tag": false keeps tags as plain vX.Y.Z: release-please otherwise
# prefixes the package name (dyness-b3-bms-mqtt-v0.1.0), and the quick-start archive URL
# and unpacked directory name expect vX.Y.Z (INST-18).
#
# .release-please-manifest.json holds the last *released* version, and release-please
# treats whatever it says as already released. Nothing has been tagged yet, so it starts
# at 0.0.0 while pyproject.toml says 0.1.0: the first release PR then proposes 0.1.0
# (a feat bumps the minor version before 1.0). Starting the manifest at 0.1.0 would make
# that first release 0.2.0. Each release PR moves the manifest and pyproject.toml together.
name: release-please

on:
  push:
    branches: [main]

permissions:
  # Push the release branch and tags, and create the GitHub release.
  contents: write
  # Open and update the release PR.
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
